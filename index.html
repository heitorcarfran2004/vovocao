<style>
/* Quiz de uma coluna, celular primeiro. Motivo da marca: o "radar" de 7 pontas (os 7 sinais). */
:root{
  --bg:#F2F6F4; --card:#FFFFFF; --ink:#14201B; --muted:#5A6A63; --line:#D8E2DD; --soft:#E7EFEB;
  --accent:#0C7563; --accent-ink:#FFFFFF; --accent-soft:#DDF0EA;
  --at:#C4471B; --at-soft:#FBE6DC;          /* atenção */
  --ob:#B07A12; --ob-soft:#FBF0D6;          /* observar */
  --no:#6C7A74; --no-soft:#E9EEEC;          /* não observado */
  --f-d:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-b:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-b);min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
/* topo: marca no centro, voltar à esquerda, barra embaixo (como os quizzes que escalam) */
.topo{max-width:520px;margin:0 auto;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.marca-linha{position:relative;display:flex;align-items:center;justify-content:center;height:34px}
.marca{display:inline-flex;align-items:center;gap:7px;font:800 17px/1 var(--f-d);color:var(--ink);letter-spacing:-.01em}
.marca i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.voltar{position:absolute;left:-6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--ink);font:600 22px/1 var(--f-b);padding:6px 8px;cursor:pointer}
.prog{margin-top:8px}
.prog .ato{font:600 10.5px/1 var(--f-b);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;display:flex;justify-content:space-between}
.prog .ato span:last-child{color:var(--muted);letter-spacing:.04em}
.trilha{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.trilha i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .45s ease}
/* a pergunta fica no meio da tela do celular; telas longas (raça, radar) começam do topo */
main{max-width:520px;margin:0 auto;min-height:calc(100svh - 120px);display:flex;flex-direction:column;justify-content:center;padding-block:18px 12px}
main.longa{justify-content:flex-start}
.tela{animation:entra .35s ease both;width:100%}
.pergunta h2,.pergunta .sub{text-align:center}
.ilustra{display:grid;place-items:center;margin:0 auto 14px;width:92px;height:92px;border-radius:50%;background:var(--accent-soft);font-size:48px;line-height:1}
.ilustra.at{background:var(--at-soft)}
.ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:24px;line-height:1;overflow:hidden}
.ic img{width:100%;height:100%;object-fit:cover}
.seta{flex:none;margin-left:auto;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:15px}
.op.on .seta{border-color:var(--accent);color:var(--accent)}
.checks{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 14px;margin:14px 0 4px;font-size:14.5px;font-weight:600}
.hero{width:100%;aspect-ratio:16/10;border-radius:18px;overflow:hidden;background:var(--soft);margin:4px 0 6px;display:grid;place-items:center}
.hero img{width:100%;height:100%;object-fit:cover}
.sexo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sexo .op{flex-direction:column;justify-content:center;gap:8px;padding:18px 10px;font-weight:600}
.sexo svg{width:54px;height:54px}
.grade .op.raca-card,.grade .op.larga{justify-content:flex-start;text-align:left;gap:10px;padding:8px 10px;min-height:60px}
.raca-card .ic{width:44px;height:44px;border-radius:50%;font-size:26px}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.tela,.linha,.ponto,.varredura{animation:none!important;transition:none!important}}
h1{font:800 clamp(28px,7.4vw,38px)/1.08 var(--f-d);letter-spacing:-.015em;margin:6px 0 12px;text-wrap:balance}
h2{font:800 clamp(23px,6vw,29px)/1.15 var(--f-d);letter-spacing:-.01em;margin:4px 0 10px;text-wrap:balance}
.sub{color:var(--muted);font-size:16.5px;margin:0 0 20px}
.selo{display:inline-flex;align-items:center;gap:8px;font:700 12px/1 var(--f-b);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:99px}
.opcoes{display:flex;flex-direction:column;gap:10px}
.op{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;font:500 16px/1.35 var(--f-b);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.op:hover{border-color:var(--accent)}
.op:active{transform:scale(.99)}
.op.on{border-color:var(--accent);background:var(--accent-soft)}
.op .mk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.op.multi .mk{border-radius:6px}
.op.on .mk{border-color:var(--accent);background:var(--accent)}
.op.on .mk::after{content:"";width:8px;height:8px;border-radius:2px;background:#fff}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grade .op{padding:13px 12px;font-size:15px;justify-content:center;text-align:center;min-height:56px}
.grade .op.larga{grid-column:1/-1}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:700 17px/1.2 var(--f-b);padding:17px 18px;cursor:pointer;margin-top:18px;box-shadow:0 6px 16px -8px rgba(12,117,99,.6)}
.btn:disabled{opacity:.45;box-shadow:none;cursor:default}
.campo{width:100%;font:600 20px/1.2 var(--f-b);padding:16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.campo:focus{outline:none;border-color:var(--accent)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.sug{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sug button{border:1.5px solid var(--accent);background:var(--card);color:var(--accent);border-radius:99px;padding:8px 14px;font:600 14px var(--f-b);cursor:pointer}
.sug button.fraco{border-style:dashed;border-color:var(--line);color:var(--muted)}
.dados-raca{display:flex;flex-direction:column;gap:10px}
.dado-raca{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--at);border-radius:12px;padding:12px}
.dado-raca b{display:block;font:800 16px/1.2 var(--f-d);margin-bottom:4px}
.dado-raca p{margin:0;font-size:14.5px;line-height:1.45}
.caixa-raca{grid-column:1/-1;background:var(--card);border:1.5px solid var(--accent);border-radius:14px;padding:12px}
.caixa-raca .campo{font-size:17px;padding:13px 14px}
.caixa-raca .dica{margin-top:8px}
.dica{font-size:13.5px;color:var(--muted);margin-top:10px}
.idade{display:flex;align-items:center;justify-content:center;gap:18px;margin:18px 0 6px}
.idade button{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font:700 26px var(--f-b);color:var(--ink);cursor:pointer}
.idade output{font:800 64px/1 var(--f-d);min-width:110px;text-align:center}
.idade small{display:block;font:600 14px var(--f-b);color:var(--muted);margin-top:4px}
.cartao{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.grande{font:800 46px/1 var(--f-d);color:var(--accent)}
.lista{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.lista li{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:10px;padding:10px 12px;font-size:15px}
.lista li b{color:var(--at)}
.nota{font-size:12px;color:var(--muted);margin-top:14px}
.sabia{font:800 13px/1 var(--f-b);letter-spacing:.12em;text-transform:uppercase;color:var(--at)}
/* radar */
.radar-wrap{display:grid;place-items:center;margin:4px 0 12px}
.radar{width:min(260px,72vw);height:auto}
.radar.res{width:min(208px,58vw)}
/* resultado: o sinal novo entra no topo e empurra os anteriores; placar + botão entram acima da lista no fim */
.sinais .linha{animation:none;opacity:1;transform:none}
.sinais .linha.nova{animation:desce .45s ease both}
@keyframes desce{from{opacity:0;max-height:0;padding-block:0;margin-top:-8px;transform:translateY(-10px)}to{opacity:1;max-height:90px;transform:none}}
.topo-res{opacity:0;max-height:0;overflow:hidden;transition:opacity .45s ease,max-height .5s ease}
.topo-res.on{opacity:1;max-height:320px}
.placar2{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--accent);border-radius:14px;padding:12px 16px;margin:2px 0 0}
.placar2 .num{font:800 38px/1 var(--f-d);white-space:nowrap}
.placar2 .num span{color:var(--muted);font-size:22px}
.placar2 p{margin:0;font-size:14px;color:var(--muted)}
.placar2 p b{color:var(--ink);display:block;font-size:15.5px}
.topo-res .btn{margin:10px 0 14px}
.radar .anel{fill:none;stroke:var(--line);stroke-width:1}
.radar .raio{stroke:var(--line);stroke-width:1}
.varredura{transform-origin:130px 130px;animation:gira 3.2s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.ponto{opacity:0;animation:aparece .4s ease forwards}
@keyframes aparece{to{opacity:1}}
.sinais{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.linha{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;opacity:0;transform:translateX(-8px);animation:linha .4s ease forwards}
@keyframes linha{to{opacity:1;transform:none}}
.linha .nm{font-weight:600}
.linha .nm small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.pill{flex:none;font:700 12px/1 var(--f-b);padding:7px 10px;border-radius:99px;letter-spacing:.02em}
.p-at{background:var(--at-soft);color:var(--at)} .p-ob{background:var(--ob-soft);color:var(--ob)} .p-no{background:var(--no-soft);color:var(--no)}
.placar{text-align:center;margin:18px 0 4px;opacity:0;animation:aparece .5s ease forwards}
.placar .num{font:800 44px/1 var(--f-d)}
.placar .num span{color:var(--muted);font-size:28px}
/* carregamento + vsl */
.carga{height:14px;background:var(--soft);border-radius:99px;overflow:hidden;margin:14px 0 8px;border:1px solid var(--line)}
.carga i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#19a588);transition:width .8s linear}
.etapa-carga{font-size:14px;color:var(--muted);min-height:21px}
.video{position:relative;aspect-ratio:9/16;max-height:72vh;max-width:100%;margin:12px auto 0;background:#0E1613;border-radius:16px;overflow:hidden;display:grid;place-items:center;color:#cfe2da;text-align:center}
.video video{width:100%;height:100%;object-fit:cover}
.video .ph{padding:20px;font-size:14px}
.rodape{max-width:520px;margin:28px auto 0;font-size:11.5px;color:var(--muted);text-align:center}
/* seta "role para baixo": aparece quando há conteúdo abaixo da dobra e some no fim (modelo do quiz da Miçanga) */
.descer{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;
  background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(12,117,99,.45);opacity:0;pointer-events:none;transition:opacity .3s,bottom .3s}
.descer svg{width:22px;height:22px}
.descer.on{opacity:.95;pointer-events:auto;animation:quica 1.4s ease-in-out infinite}
.descer.alto{bottom:92px}
@keyframes quica{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}
/* VSL: só toca no clique (o Smart Autoplay do vTurb fica pausado no início, com este botão por cima) */
.play-vsl{position:absolute;inset:0;z-index:5;border:0;padding:0;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:linear-gradient(180deg,rgba(8,20,16,.15) 0%,rgba(8,20,16,.55) 100%);font:700 17px/1.2 var(--f-b);text-shadow:0 2px 10px rgba(0,0,0,.5)}
.play-vsl i{width:84px;height:84px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:pulsa 1.8s ease-in-out infinite}
.play-vsl i svg{width:34px;height:34px;margin-left:5px}
/* ---------- TSL (oferta personalizada) ---------- */
.tsl{display:flex;flex-direction:column;gap:34px;padding-bottom:84px}
.tsl section{display:flex;flex-direction:column;gap:12px}
.tsl .kick{margin-bottom:2px}
.tsl h2{margin:0}
.tsl .tit{font:800 clamp(21px,5.6vw,26px)/1.15 var(--f-d);letter-spacing:-.01em;margin:6px 0 2px;text-wrap:balance}
.tsl .kick{font:700 11.5px/1 var(--f-b);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.perfil{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(160deg,#0E8470 0%,#0B6B5A 100%);color:#fff;padding:18px;box-shadow:0 18px 36px -22px rgba(12,117,99,.9)}
.perfil::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.07)}
.perfil .topo-p{display:flex;gap:14px;align-items:center;position:relative;z-index:1}
.perfil .foto{flex:none;width:72px;height:72px;border-radius:50%;overflow:hidden;background:#E8F3EF;display:grid;place-items:center;font-size:38px;box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.perfil .foto img{width:100%;height:100%;object-fit:cover}
.perfil .nm{font:800 28px/1.05 var(--f-d)}
.perfil .rc{font-size:14px;opacity:.9;margin-top:3px}
.perfil .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.perfil .tile{background:rgba(255,255,255,.13);border-radius:12px;padding:10px 8px;text-align:center}
.perfil .tile b{display:block;font:800 20px/1.05 var(--f-d)}
.perfil .tile span{font-size:11.5px;opacity:.9;line-height:1.25;display:block;margin-top:3px}
.chips-radar{display:flex;flex-wrap:wrap;gap:6px}
.compat{display:flex;gap:16px;align-items:center;background:var(--card);border:1.5px solid var(--accent);border-radius:18px;padding:16px}
.anel-c{flex:none;width:96px;height:96px;position:relative}
.anel-c svg{width:96px;height:96px;transform:rotate(-90deg)}
.anel-c b{position:absolute;inset:0;display:grid;place-items:center;font:800 25px/1 var(--f-d);color:var(--accent)}
.compat .tx b{font:800 17px/1.2 var(--f-d)}
.compat .tx p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.checks-l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks-l li{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14.5px;line-height:1.35}
.checks-l li i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800}
.checks-l.rec li i{background:var(--accent-soft);font-size:15px}
.checks-l li small{display:block;color:var(--muted);font-size:13px}
.dor{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--at);border-radius:14px;padding:13px}
.dor .e{flex:none;width:44px;height:44px;border-radius:12px;background:var(--at-soft);display:grid;place-items:center;font-size:23px}
.dor b{display:block;font:800 16px/1.2 var(--f-d)}
.dor .dado{display:block;margin-top:4px;font-weight:700;color:var(--at);font-size:14.5px;line-height:1.3}
.dor .ve{display:block;margin-top:5px;font-size:13.5px;color:var(--muted)}
.dor .marcou{display:inline-block;margin-top:7px;font:700 11.5px/1 var(--f-b);background:var(--at-soft);color:var(--at);padding:6px 9px;border-radius:99px}
.silencio{background:#14201B;color:#fff;border-radius:18px;padding:18px;text-align:center}
.silencio .big{font:800 24px/1.15 var(--f-d)}
.silencio p{margin:8px 0 0;font-size:14.5px;opacity:.85}
.silencio .n{color:#7FE0C2}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vs .col{border-radius:16px;padding:12px}
.vs .sem{background:var(--at-soft)} .vs .com{background:var(--accent-soft)}
.vs h4{margin:0 0 8px;font:800 14px/1.2 var(--f-d)}
.vs .sem h4{color:var(--at)} .vs .com h4{color:var(--accent)}
.vs ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:13.5px;line-height:1.3}
.cuidados{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cuidado{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.cuidado .e{font-size:24px}
.cuidado b{display:block;font:800 14.5px/1.2 var(--f-d);margin-top:6px}
.cuidado span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.cuidado.larga{grid-column:1/-1;display:flex;gap:12px;align-items:center}
.cuidado.larga b{margin-top:0}
.telas{display:flex;gap:12px;overflow-x:auto;overflow-y:visible;scroll-snap-type:x mandatory;padding:6px 16px 30px;margin:0 -16px -18px;scrollbar-width:none}
.telas img{flex:none;width:58%;max-width:230px;aspect-ratio:390/797;object-fit:cover;object-position:top;border-radius:22px;border:6px solid #14201B;scroll-snap-align:center;box-shadow:0 10px 18px -12px rgba(0,0,0,.45);background:#fff}
.oferta-box{background:var(--card);border:2px solid var(--accent);border-radius:22px;padding:18px;text-align:center;box-shadow:0 18px 40px -26px rgba(12,117,99,.8)}
.oferta-box .de{font-size:14px;color:var(--muted);font-weight:600}
.oferta-box .preco{font:800 58px/1 var(--f-d);color:var(--accent);letter-spacing:-.03em;margin:6px 0 4px}
.oferta-box .preco small{font-size:24px;vertical-align:top;margin-right:3px}
.oferta-box .unico{display:inline-block;font:700 13px/1 var(--f-b);color:var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:99px}

<p class="rodape" id="rodape">Este diagnóstico mostra sinais e riscos conhecidos da raça e da idade. Não substitui a consulta com o médico-veterinário.</p>

<script src="dados/racas-quiz.js"></script>

<script src="dados/tsl-racas.js"></script>
<script>
(function () {
'use strict';
// ---------- estado ----------
const URLP = new URLSearchParams(location.search);
const V = Math.min(5, Math.max(1, +URLP.get('v') || 1));          // variação da abertura (?v=1..5)
const sid = (() => { try { let s = sessionStorage.getItem('cid'); if (!s) { s = Math.random().toString(36).slice(2, 10); sessionStorage.setItem('cid', s); } return s; } catch (e) { return Math.random().toString(36).slice(2, 10); } })();
const st = { nome: '', sexo: 'm', ficha: null, racaRotulo: '', racaOrigem: '', porte: '', idade: 10, resp: {}, multi: {} };
const F = window.FICHAS;
const SINAIS = [
  ['apetite', 'Apetite', 'come, recusa, só na mão'],
  ['agua', 'Água e xixi', 'quanto bebe, quanto faz'],
  ['patas', 'Patas e coluna', 'levantar, escorregar, subir'],
  ['noite', 'Sono, noite e cabeça', 'sono, madrugada, desorientação'],
  ['boca', 'Boca e dentes', 'hálito, tártaro, gengiva'],
  ['respiracao', 'Respiração e coração', 'tosse, cansaço, ofegar'],
  ['caroco', 'Caroços e gengiva', 'caroço novo, gengiva pálida'],
];
// ---------- eventos (abandono por etapa) ----------
// cada evento leva: etapa, posição dela no quiz, tempo na tela, resposta, aparelho e as UTMs do anúncio (para o painel /painel)
let telaDesde = Date.now();
const UTM = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'].reduce((a, k) => { const v = URLP.get(k); if (v) a[k] = v; return a; }, {});
const APARELHO = /Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'celular' : 'computador';
const REVISAO_TSL = /\/tsl\/?$/.test(location.pathname); // /tsl = página só para revisar a TSL
function enviar(ev, etapa, dados) {
  if (URLP.get('teste') || REVISAO_TSL) return; // atalho de revisão não suja o painel
  const r = dados && dados.r != null ? (Array.isArray(dados.r) ? dados.r.join(', ') : String(dados.r)) : (dados && dados.texto) || null;
  const corpo = JSON.stringify({ quiz: 'vovocao', variante: 'v' + V, sid, t: Date.now(), v: V, ev, tipo: ev, etapa, ordem: typeof E !== 'undefined' ? E.findIndex(x => x.id === etapa) : null,
    resposta: r, ms: Date.now() - telaDesde, dispositivo: APARELHO, ...UTM, dados: dados || null });
  try { if (navigator.sendBeacon) navigator.sendBeacon('/api/e', new Blob([corpo], { type: 'application/json' })); else fetch('/api/e', { method: 'POST', body: corpo, keepalive: true }); } catch (e) {}
}
// ---------- texto personalizado ----------
const fem = () => st.sexo === 'f';
const o = () => fem() ? 'a' : 'o', O = () => fem() ? 'A' : 'O';
const ele = () => fem() ? 'ela' : 'ele', Ele = () => fem() ? 'Ela' : 'Ele', dele = () => fem() ? 'dela' : 'dele';
const N = () => st.nome || 'seu cão';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function pers(t) {
  let r = t.replace(/\bO \{nome\}/g, O() + ' ' + N()).replace(/\bdo \{nome\}/g, 'd' + o() + ' ' + N())
    .replace(/\bno \{nome\}/g, 'n' + o() + ' ' + N()).replace(/\{nome\}/g, N());
  if (fem()) r = r.replace(/\bele\b/g, 'ela').replace(/\bpego\b/g, 'pega').replace(/\bdeitado\b/g, 'deitada').replace(/\bapático\b/g, 'apática').replace(/\bestranho\b/g, 'estranha').replace(/\bsonolento\b/g, 'sonolenta').replace(/\bdesorientado\b/g, 'desorientada').replace(/\bpreguiçoso\b/g, 'preguiçosa');
  return r;
}
// ---------- idade humana (tabela por porte da AVMA, estimativa) ----------
function idadeHumana(a, porte) {
  const passo = porte === 'grande' ? 6 : porte === 'medio' || porte === 'médio' ? 5 : 4;
  if (a <= 1) return Math.round(15 * a); if (a <= 2) return Math.round(15 + 9 * (a - 1)); return Math.round(24 + (a - 2) * passo);
}
// ---------- opções padrão de sinal ----------
const SINAL4 = (sinal) => [
  { e: '😟', t: 'Sim', s: { [sinal]: 'atencao' } }, { e: '🤔', t: 'Às vezes', s: { [sinal]: 'atencao' } },
  { e: '🙂', t: 'Não', s: { [sinal]: 'observar' } }, { e: '🤷', t: 'Não reparei', s: { [sinal]: 'nao' } }];
// ícone da opção: foto (se existir em img/) ou emoji
const icone = (op) => op.img ? `<span class="ic"><img src="${op.img}" alt="" onerror="this.parentNode.textContent='${op.e || '🐶'}'"></span>` : op.e ? `<span class="ic">${op.e}</span>` : '<span class="mk"></span>';
const ILU_SINAL = { boca: '🦷', respiracao: '❤️', agua: '💧', coluna: '🦴', patas: '🐾', gengiva: '👄', caroco: '🔎', noite: '🌙', apetite: '🍖' };
const ilustra = (e) => { const x = typeof e.ilu === 'function' ? e.ilu() : e.ilu; return x ? `<div class="ilustra${e.iluAt ? ' at' : ''}" aria-hidden="true">${x}</div>` : ''; };
const SVG_MACHO = '<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="26" cy="38" r="16" fill="none" stroke="#3B8FD1" stroke-width="6"/><path d="M38 26 54 10M42 10h12v12" fill="none" stroke="#3B8FD1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SVG_FEMEA = '<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="24" r="16" fill="none" stroke="#E0789A" stroke-width="6"/><path d="M32 40v18M23 50h18" fill="none" stroke="#E0789A" stroke-width="6" stroke-linecap="round"/></svg>';
const temChave = (k) => !!(st.ficha && st.ficha.perguntas.some(p => p.chave === k));

// ---------- as etapas (máx. 30) ----------
const ATOS = ['Conhecendo', 'A rotina', 'Os sinais da raça', 'Qualidade de vida', 'Resultado'];
const ABERTURAS = {
  1: { selo: 'Diagnóstico gratuito · 2 minutos', h: 'Descubra o que a raça do seu cão pede de você agora para ele viver mais e melhor', s: 'Responda sobre a rotina dele e receba o Radar dos 7 sinais silenciosos da idade, os que a maioria dos donos confunde com velhice.' },
  2: { selo: 'Para cães a partir de 7 anos', h: 'Seu cão já passou dos 7 anos? Faça o diagnóstico gratuito dos 7 sinais silenciosos da idade', s: 'Cada raça envelhece de um jeito. Descubra o que pede atenção no seu agora, antes de virar problema.' },
  3: { selo: 'Diagnóstico gratuito', h: 'O que pode estar tirando anos do seu cão sem você perceber?', s: 'Pela raça e pela rotina dele: em 2 minutos você sabe o que é da idade e o que é sinal de alerta.' },
  4: { selo: 'Diagnóstico de longevidade · grátis', h: 'Como o seu cão está envelhecendo?', s: 'Descubra os riscos da raça dele, os sinais que você já pode estar vendo e o que fazer para ele viver mais e com disposição.' },
  5: { selo: 'Diagnóstico gratuito · 2 minutos', h: 'Mais anos e mais disposição para o seu velhinho começam por aqui', s: 'Descubra o que a raça e a idade dele pedem de você agora.' },
};
const RACAS_BOTOES = [['srd', 'Vira-lata (SRD)'], ['shih-tzu', 'Shih Tzu'], ['poodle', 'Poodle'], ['yorkshire', 'Yorkshire'], ['pinscher', 'Pinscher'],
  ['lulu', 'Lulu da Pomerânia'], ['lhasa', 'Lhasa Apso'], ['dachshund', 'Salsicha'], ['golden', 'Golden'], ['maltes', 'Maltês'], ['pug', 'Pug']];

const E = [
  // ATO 1
  { id: 'abertura', ato: 0, tipo: 'abertura' },
  { id: 'nome', ato: 0, tipo: 'nome' },
  { id: 'sexo', ato: 0, tipo: 'unica', sexo: true, q: () => `${esc(N())} é macho ou fêmea?`, op: () => [{ t: 'Macho', v: 'm', svg: SVG_MACHO }, { t: 'Fêmea', v: 'f', svg: SVG_FEMEA }], ao: (op) => { st.sexo = op.v; } },
  { id: 'raca', ato: 0, tipo: 'raca' },
  { id: 'porte', ato: 0, tipo: 'unica', se: () => st.racaOrigem === 'srd' || st.racaOrigem === 'mistura' || (st.racaOrigem === 'outra' && !st.porte),
    q: () => `Qual o porte d${o()} ${esc(N())}?`, op: () => [{ t: 'Pequeno (até 10 kg)', v: 'pequeno', img: 'img/porte-pequeno.webp', e: '🐕' }, { t: 'Médio (10 a 25 kg)', v: 'medio', img: 'img/porte-medio.webp', e: '🐕' }, { t: 'Grande (mais de 25 kg)', v: 'grande', img: 'img/porte-grande.webp', e: '🐕‍🦺' }],
    ao: (op) => { st.porte = op.v; if (st.racaOrigem === 'mistura') st.ficha = montarMistura(); else if (st.racaOrigem === 'srd' || !st.ficha || st.ficha.id.startsWith('srd')) st.ficha = F['srd-' + op.v]; } },
  { id: 'idade', ato: 0, tipo: 'idade' },
  { id: 'idade-humana', ato: 0, tipo: 'info', info: telaIdadeHumana },
  // ATO 2
  { id: 'porta', ato: 1, tipo: 'unica', ilu: '🚪', q: () => `${O()} ${esc(N())} ainda vem te receber na porta quando você chega?`, op: () => [{ e: '🎉', t: 'Sempre, com festa' }, { e: '🐾', t: 'Às vezes, mais devagar' }, { e: '😔', t: 'Quase nunca' }] },
  { id: 'sono', ato: 1, tipo: 'unica', ilu: '😴', q: () => `${Ele()} tem dormido mais que antes?`, op: () => [{ e: '😊', t: 'Igual sempre', s: { noite: 'observar' } }, { e: '🥱', t: 'Um pouco mais', s: { noite: 'observar' } }, { e: '💤', t: 'Bem mais, quase o dia todo', s: { noite: 'atencao' } }, { e: '🤷', t: 'Não reparei', s: { noite: 'nao' } }] },
  { id: 'apetite', ato: 1, tipo: 'unica', ilu: '🍖', q: () => `Como anda o apetite d${o()} ${esc(N())}?`, op: () => [{ e: '😋', t: 'Come bem, como sempre', s: { apetite: 'observar' } }, { e: '😒', t: 'Ficou mais chat' + o() + ' pra comer', s: { apetite: 'atencao' } }, { e: '🥄', t: 'Só come na mão ou com algo misturado', s: { apetite: 'atencao' } }, { e: '🤷', t: 'Não reparei', s: { apetite: 'nao' } }] },
  { id: 'agua', ato: 1, tipo: 'unica', ilu: '💧', q: () => `E a água e o xixi d${o()} ${esc(N())}?`, op: () => [{ e: '👌', t: 'Normal, como sempre', s: { agua: 'observar' } }, { e: '🚰', t: 'Bebe mais água que antes', s: { agua: 'atencao' } }, { e: '💦', t: 'Faz mais xixi, ou já fez dormindo', s: { agua: 'atencao' } }, { e: '🤷', t: 'Não reparei', s: { agua: 'nao' } }] },
  { id: 'patas', ato: 1, tipo: 'multi', ilu: '🐾', q: () => `Você já notou alguma destas n${o()} ${esc(N())}?`, sub: 'Pode marcar mais de uma.',
    op: () => [{ e: '🦵', t: 'As patinhas de trás tremem' }, { e: '⛸️', t: 'Escorrega no piso' }, { e: '🐢', t: 'Demora pra levantar' }, { e: '🛋️', t: 'Não sobe mais no sofá ou na cama' }, { e: '✅', t: 'Nenhuma destas', so: true, s: { patas: 'observar' } }, { e: '🤷', t: 'Não reparei', so: true, s: { patas: 'nao' } }],
    efeito: (marc) => marc.some(m => !m.so) ? { patas: 'atencao' } : (marc[0] && marc[0].s) || {} },
  { id: 'consulta', ato: 1, tipo: 'unica', ilu: '🩺', q: () => `Quando foi a última consulta d${o()} ${esc(N())} no veterinário?`, op: () => [{ e: '🗓️', t: 'Menos de 6 meses' }, { e: '📅', t: 'Entre 6 meses e 1 ano' }, { e: '⏳', t: 'Mais de 1 ano' }, { e: '🤔', t: 'Não lembro' }] },
  // ATO 3
